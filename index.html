<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gastos - Proyecto Final Refactorizado</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./styles/estilos.css">

    <script defer src="./js/logic.js"></script>
    <script defer src="./js/main.js"></script>
</head>
<body>
    <header class="titulo">
        <h1>Calculadora de Gastos Personales</h1>
    </header>

    <main class="contenedor">
        <section class="configuracion-inicial">
            <label for="ingreso">Monto de Ingreso Mensual:</label>
            <input type="number" id="ingreso" placeholder="Ej: 800000">
        </section>

        <section class="formulario-registro">
            <h3>Registrar un nuevo egreso</h3>
            
            <input type="text" id="nombreGasto" placeholder="Descripción del gasto">
            <input type="number" id="montoGasto" placeholder="Monto del gasto $">
            
            <label for="categoriaGasto">Categoría:</label>
            <select id="categoriaGasto">
                </select>

            <button id="botonGuardar" class="contenedor_boton">Registrar Gasto</button>
        </section>

        <section class="listado-y-totales">
            <h3>Historial de Movimientos</h3>
            <div id="listaGastos">
                </div>
            
            <div id="resultado">
                </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
